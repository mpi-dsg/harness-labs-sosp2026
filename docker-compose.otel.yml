# Overlay: OpenTelemetry tracing via Jaeger (Lab 1, Part 3).
#
# OpenClaw's diagnostics-otel plugin (bundled in the image) exports traces,
# metrics, and logs over OTLP/HTTP. Jaeger v2 accepts OTLP/HTTP on port 4318
# by default, so it works as a generic OTLP backend; there is no
# OpenClaw-specific Jaeger integration.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.otel.yml up -d
#
# Then enable the plugin (see Lab 1):
#   docker compose run --rm openclaw-cli plugins enable diagnostics-otel
#
# The exporter is configured by the standard OTEL_* environment variables below,
# not by OpenClaw config keys. The plugin ships an empty configSchema with
# additionalProperties:false, so `config set diagnostics.otel.endpoint ...` is
# accepted by the CLI, stored in openclaw.json, and never read by anything. The
# symptom is that Jaeger lists only itself and no traces ever arrive.

services:
  # The exporter reads the standard OpenTelemetry environment variables. Without
  # these the plugin loads, reports healthy, and exports nothing.
  openclaw-gateway:
    environment:
      OTEL_SERVICE_NAME: openclaw-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp

  jaeger:
    # Built locally from jaeger/Dockerfile: the digest-pinned upstream v2 release
    # with its Alpine TLS libraries (libcrypto3/libssl3) patched. Pulling upstream
    # directly would skip that patch.
    image: harness-jaeger:2.19.0
    build:
      context: ./jaeger
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 256
    mem_limit: 1g
    # Jaeger v2 exposes the OTel collector health extension on 13133 at /status
    # (not / -- that 404s). wget ships in the Alpine base.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
